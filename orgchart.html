<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GoCongo Org Chart</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; background: #0f1419; color: #e8e8e8; overflow: hidden; height: 100vh; }

.header { position: fixed; top: 0; left: 0; right: 0; z-index: 100; background: linear-gradient(135deg, #1a472a 0%, #0d2818 100%); border-bottom: 2px solid #2d8a4e; padding: 12px 24px; display: flex; align-items: center; gap: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
.logo { display: flex; align-items: center; gap: 10px; }
.logo-icon { width: 36px; height: 36px; background: #2d8a4e; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: 800; color: #fff; font-size: 14px; }
.logo-text { font-size: 20px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
.logo-sub { font-size: 11px; color: #7ec69a; font-weight: 400; }

.search-box { position: relative; flex: 1; max-width: 400px; }
.search-box input { width: 100%; padding: 8px 14px 8px 36px; border: 1px solid #2d5a3a; border-radius: 8px; background: rgba(255,255,255,0.08); color: #fff; font-size: 14px; outline: none; transition: all 0.2s; }
.search-box input:focus { border-color: #2d8a4e; background: rgba(255,255,255,0.12); }
.search-box input::placeholder { color: #7a9a87; }
.search-icon { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: #7a9a87; font-size: 14px; }
.search-results { position: absolute; top: 100%; left: 0; right: 0; background: #1a2a20; border: 1px solid #2d5a3a; border-radius: 8px; margin-top: 4px; max-height: 300px; overflow-y: auto; display: none; z-index: 200; }
.search-results.active { display: block; }
.search-item { padding: 8px 14px; cursor: pointer; border-bottom: 1px solid #1f3328; }
.search-item:hover { background: #243a2e; }
.search-item .name { font-weight: 600; color: #fff; font-size: 13px; }
.search-item .info { font-size: 11px; color: #7ec69a; }

.stats { display: flex; gap: 16px; align-items: center; margin-left: auto; }
.stat { font-size: 12px; color: #7ec69a; }
.stat b { color: #fff; }

.controls { position: fixed; bottom: 20px; right: 20px; z-index: 100; display: flex; flex-direction: column; gap: 6px; }
.ctrl-btn { width: 40px; height: 40px; border: 1px solid #2d5a3a; border-radius: 10px; background: #1a2a20; color: #fff; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; }
.ctrl-btn:hover { background: #2d8a4e; border-color: #2d8a4e; }

.tooltip { position: fixed; z-index: 200; background: #1a2a20; border: 1px solid #2d8a4e; border-radius: 10px; padding: 14px 18px; pointer-events: none; opacity: 0; transition: opacity 0.15s; box-shadow: 0 8px 32px rgba(0,0,0,0.5); max-width: 300px; }
.tooltip.active { opacity: 1; }
.tooltip .tt-name { font-weight: 700; font-size: 14px; color: #fff; margin-bottom: 4px; }
.tooltip .tt-pos { font-size: 12px; color: #d4a843; margin-bottom: 2px; }
.tooltip .tt-dept { font-size: 12px; color: #7ec69a; }
.tooltip .tt-company { font-size: 11px; color: #8a9a90; margin-top: 2px; }
.tooltip .tt-email { font-size: 11px; color: #5a9ad5; margin-top: 4px; }
.tooltip .tt-reports { font-size: 11px; color: #8a9a90; margin-top: 4px; }

.filter-panel { position: fixed; top: 60px; right: 20px; z-index: 100; background: #1a2a20; border: 1px solid #2d5a3a; border-radius: 10px; padding: 12px 16px; display: none; max-height: calc(100vh - 100px); overflow-y: auto; width: 220px; }
.filter-panel.active { display: block; }
.filter-title { font-weight: 700; color: #fff; margin-bottom: 8px; font-size: 13px; }
.filter-item { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; cursor: pointer; padding: 3px 4px; border-radius: 4px; font-size: 12px; color: #b0c4b8; }
.filter-item:hover { background: rgba(255,255,255,0.05); }
.filter-item input { accent-color: #2d8a4e; }

.breadcrumb { position: fixed; top: 60px; left: 20px; z-index: 100; background: rgba(26,42,32,0.9); border: 1px solid #2d5a3a; border-radius: 8px; padding: 6px 12px; font-size: 11px; color: #7ec69a; max-width: 500px; display: none; }
.breadcrumb.active { display: block; }
.breadcrumb span { cursor: pointer; }
.breadcrumb span:hover { color: #fff; text-decoration: underline; }

#canvas { width: 100%; height: 100vh; }
</style>
</head>
<body>

<div class="header">
  <div class="logo">
    <div class="logo-icon">GC</div>
    <div>
      <div class="logo-text">GoCongo <span class="logo-sub">Organizational Chart</span></div>
    </div>
  </div>
  <div class="search-box">
    <span class="search-icon">&#128269;</span>
    <input type="text" id="search" placeholder="Search employees, positions, departments..." autocomplete="off">
    <div class="search-results" id="searchResults"></div>
  </div>
  <div class="stats">
    <span class="stat"><b id="totalCount">0</b> employees</span>
    <span class="stat"><b id="deptCount">0</b> departments</span>
    <span class="stat" id="zoomLevel">100%</span>
  </div>
  <button class="ctrl-btn" onclick="toggleFilters()" title="Filter departments" style="width:auto;padding:0 12px;font-size:13px;">Filters</button>
</div>

<div class="tooltip" id="tooltip"></div>
<div class="breadcrumb" id="breadcrumb"></div>
<canvas id="canvas"></canvas>

<div class="controls">
  <button class="ctrl-btn" onclick="zoomBy(1.3)" title="Zoom in">+</button>
  <button class="ctrl-btn" onclick="zoomBy(0.7)" title="Zoom out">&minus;</button>
  <button class="ctrl-btn" onclick="fitToScreen()" title="Fit to screen">&#8634;</button>
  <button class="ctrl-btn" onclick="expandAll()" title="Expand all">&#9654;</button>
  <button class="ctrl-btn" onclick="collapseToLevel(2)" title="Collapse to L2">&#9660;</button>
</div>

<div class="filter-panel" id="filterPanel"></div>

// Dimensions
const NODE_W = 230, NODE_H = 74, H_GAP = 24, V_GAP = 50;
const HEADER_H = 56;

// State
let collapsed = new Set();
let nodeById = {};
let visibleNodes = [];
let visibleLinks = [];

// Canvas
const cvs = document.getElementById('canvas');
const ctx = cvs.getContext('2d');
let dpr = window.devicePixelRatio || 1;

function resizeCanvas() {
  dpr = window.devicePixelRatio || 1;
  cvs.width = window.innerWidth * dpr;
  cvs.height = window.innerHeight * dpr;
  cvs.style.width = window.innerWidth + 'px';
  cvs.style.height = window.innerHeight + 'px';
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

// Build flat index of ALL nodes (for search)
let allNodesFlat = [];
function indexAllNodes() {
  allNodesFlat = [];
  function walk(node, parent) {
    const entry = {
      id: node.id, name: node.name, code: node.code,
      position: node.position, department: node.department,
      company: node.company, email: node.email, level: node.level,
      parentId: parent ? parent.id : null,
      childCount: (node.children || []).length
    };
    allNodesFlat.push(entry);
    for (const c of node.children || []) walk(c, node);
  }
  for (const r of TREE_DATA) walk(r, null);
}

// Count all descendants of a tree node
function countDesc(treeNode) {
  let count = 0;
  for (const c of treeNode.children || []) {
    count += 1 + countDesc(c);
  }
  return count;
}

// Find tree node by id
function findTreeNode(id, roots) {
  for (const r of roots || TREE_DATA) {
    if (r.id === id) return r;
    const found = findTreeNode(id, r.children);
    if (found) return found;
  }
  return null;
}

// Flatten visible tree -> nodes & links
function buildVisible() {
  visibleNodes = [];
  visibleLinks = [];
  nodeById = {};

  function traverse(treeNode, parentId) {
    const n = {
      id: treeNode.id, name: treeNode.name, code: treeNode.code,
      position: treeNode.position, department: treeNode.department,
      company: treeNode.company, email: treeNode.email, level: treeNode.level,
      parentId: parentId,
      childIds: (treeNode.children || []).map(c => c.id),
      totalDesc: countDesc(treeNode),
      x: 0, y: 0
    };
    visibleNodes.push(n);
    nodeById[n.id] = n;

    if (!collapsed.has(treeNode.id)) {
      for (const child of treeNode.children || []) {
        traverse(child, treeNode.id);
      }
    }
  }

  for (const root of TREE_DATA) traverse(root, null);

  // Build links
  for (const n of visibleNodes) {
    if (n.parentId && nodeById[n.parentId]) {
      visibleLinks.push({ sourceId: n.parentId, targetId: n.id });
    }
  }
}

// Layout: compute x,y for each visible node
function layoutTree() {
  const childrenOf = {};
  for (const n of visibleNodes) childrenOf[n.id] = [];
  for (const n of visibleNodes) {
    if (n.parentId && nodeById[n.parentId]) {
      childrenOf[n.parentId].push(n.id);
    }
  }

  const roots = visibleNodes.filter(n => !n.parentId || !nodeById[n.parentId]);
  const subtreeW = {};

  function calcW(id) {
    const kids = childrenOf[id] || [];
    if (kids.length === 0) {
      subtreeW[id] = NODE_W + H_GAP;
      return subtreeW[id];
    }
    let w = 0;
    for (const k of kids) w += calcW(k);
    w = Math.max(w, NODE_W + H_GAP);
    subtreeW[id] = w;
    return w;
  }

  function positionNode(id, left, top) {
    const node = nodeById[id];
    const totalW = subtreeW[id] || (NODE_W + H_GAP);
    node.x = left + totalW / 2 - NODE_W / 2;
    node.y = top;

    const kids = childrenOf[id] || [];
    let cx = left;
    for (const kid of kids) {
      const kw = subtreeW[kid] || (NODE_W + H_GAP);
      positionNode(kid, cx, top + NODE_H + V_GAP);
      cx += kw;
    }
  }

  let startX = 0;
  for (const r of roots) {
    calcW(r.id);
    positionNode(r.id, startX, 0);
    startX += (subtreeW[r.id] || (NODE_W + H_GAP)) + H_GAP * 3;
  }
}

// Draw everything on canvas
function draw() {
  const W = window.innerWidth, H = window.innerHeight;
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  ctx.translate(transform.x, transform.y + HEADER_H);
  ctx.scale(transform.k, transform.k);

  // Draw links
  for (const link of visibleLinks) {
    const src = nodeById[link.sourceId];
    const tgt = nodeById[link.targetId];
    if (!src || !tgt) continue;

    const sx = src.x + NODE_W / 2, sy = src.y + NODE_H;
    const tx = tgt.x + NODE_W / 2, ty = tgt.y;
    const my = sy + (ty - sy) * 0.5;

    const isHL = highlightedId && (link.sourceId === highlightedId || link.targetId === highlightedId);
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.bezierCurveTo(sx, my, tx, my, tx, ty);
    ctx.strokeStyle = isHL ? '#2d8a4e' : '#263830';
    ctx.lineWidth = isHL ? 2.5 : 1.2;
    ctx.globalAlpha = isHL ? 1 : 0.5;
    ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Draw nodes
  for (const n of visibleNodes) {
    drawNode(n);
  }

  ctx.restore();
}

function drawNode(n) {
  const color = DEPT_COLORS[n.department] || '#607d8b';
  const isHovered = hoveredId === n.id;
  const isHL = highlightedId === n.id;
  const isActive = isHovered || isHL;
  const isCollapsed2 = collapsed.has(n.id) && n.childIds.length > 0;

  // Shadow
  ctx.save();
  ctx.shadowColor = 'rgba(0,0,0,0.35)';
  ctx.shadowBlur = isActive ? 16 : 8;
  ctx.shadowOffsetY = 2;

  // Card
  roundRect(ctx, n.x, n.y, NODE_W, NODE_H, 10);
  ctx.fillStyle = isActive ? '#1a3a28' : '#161f1a';
  ctx.fill();
  ctx.restore();

  // Border
  roundRect(ctx, n.x, n.y, NODE_W, NODE_H, 10);
  ctx.strokeStyle = isActive ? '#2d8a4e' : color;
  ctx.lineWidth = isActive ? 2 : 1;
  ctx.stroke();

  // Dept color bar
  roundRect(ctx, n.x, n.y, 5, NODE_H, 2);
  ctx.fillStyle = color;
  ctx.fill();

  // Name
  ctx.font = '600 13px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#fff';
  const displayName = truncate(n.name, 24);
  ctx.fillText(displayName, n.x + 14, n.y + 22);

  // Position
  ctx.font = '10.5px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = color;
  ctx.fillText(truncate(n.position || '', 30), n.x + 14, n.y + 40);

  // Department
  ctx.font = '9.5px "Segoe UI", system-ui, sans-serif';
  ctx.fillStyle = '#5a7a66';
  ctx.fillText(truncate(n.department || '', 30), n.x + 14, n.y + 55);

  // Expand/collapse badge
  if (n.childIds.length > 0) {
    const bx = n.x + NODE_W - 20, by = n.y + NODE_H / 2;
    ctx.beginPath();
    ctx.arc(bx, by, 11, 0, Math.PI * 2);
    ctx.fillStyle = isCollapsed2 ? '#2d8a4e' : '#1a2a20';
    ctx.fill();
    ctx.strokeStyle = color;
    ctx.lineWidth = 1;
    ctx.stroke();

    ctx.font = isCollapsed2 ? '600 8px "Segoe UI", system-ui, sans-serif' : '12px "Segoe UI", system-ui, sans-serif';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(isCollapsed2 ? '+' + n.totalDesc : '\u2212', bx, by);
    ctx.textAlign = 'left';
    ctx.textBaseline = 'alphabetic';
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r);
  ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h);
  ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r);
  ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

function truncate(str, max) {
  return str.length > max ? str.substring(0, max - 1) + '\u2026' : str;
}

function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Hit test: which node is at screen position (sx, sy)?
function hitTest(sx, sy) {
  const wx = (sx - transform.x) / transform.k;
  const wy = (sy - transform.y - HEADER_H) / transform.k;
  // Check in reverse order (top-most first)
  for (let i = visibleNodes.length - 1; i >= 0; i--) {
    const n = visibleNodes[i];
    if (wx >= n.x && wx <= n.x + NODE_W && wy >= n.y && wy <= n.y + NODE_H) {
      return n;
    }
  }
  return null;
}

// --- INTERACTION ---
let dragging = false;
let dragStartX = 0, dragStartY = 0;
let dragMoved = false;

cvs.addEventListener('mousedown', e => {
  dragging = true;
  dragMoved = false;
  dragStartX = e.clientX - transform.x;
  dragStartY = e.clientY - transform.y;
  cvs.style.cursor = 'grabbing';
});

window.addEventListener('mousemove', e => {
  if (dragging) {
    const dx = e.clientX - transform.x - dragStartX;
    const dy = e.clientY - transform.y - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    transform.x = e.clientX - dragStartX;
    transform.y = e.clientY - dragStartY;
    draw();
    return;
  }

  // Hover detection
  const node = hitTest(e.clientX, e.clientY);
  const newId = node ? node.id : null;
  if (newId !== hoveredId) {
    hoveredId = newId;
    cvs.style.cursor = node ? 'pointer' : 'grab';
    if (node) showTooltip(e, node);
    else hideTooltip();
    draw();
  } else if (node) {
    // Move tooltip with mouse
    positionTooltip(e.clientX, e.clientY);
  }
});

window.addEventListener('mouseup', e => {
  if (dragging && !dragMoved) {
    // It was a click, not a drag
    const node = hitTest(e.clientX, e.clientY);
    if (node && node.childIds.length > 0) {
      toggleNode(node.id);
    }
  }
  dragging = false;
  cvs.style.cursor = hoveredId ? 'pointer' : 'grab';
});

cvs.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.9 : 1.1;
  const newK = Math.min(2.5, Math.max(0.03, transform.k * delta));
  const mx = e.clientX, my = e.clientY;
  transform.x = mx - (mx - transform.x) * (newK / transform.k);
  transform.y = my - (my - transform.y) * (newK / transform.k);
  transform.k = newK;
  document.getElementById('zoomLevel').textContent = Math.round(transform.k * 100) + '%';
  draw();
}, { passive: false });

// Touch support
let lastTouchDist = 0, lastTouchCenter = null;
cvs.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    dragging = true; dragMoved = false;
    dragStartX = e.touches[0].clientX - transform.x;
    dragStartY = e.touches[0].clientY - transform.y;
  } else if (e.touches.length === 2) {
    dragging = false;
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    lastTouchCenter = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
  }
}, { passive: true });

cvs.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && dragging) {
    const dx = e.touches[0].clientX - transform.x - dragStartX;
    const dy = e.touches[0].clientY - transform.y - dragStartY;
    if (Math.abs(dx) > 3 || Math.abs(dy) > 3) dragMoved = true;
    transform.x = e.touches[0].clientX - dragStartX;
    transform.y = e.touches[0].clientY - dragStartY;
    draw();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const center = { x: (e.touches[0].clientX + e.touches[1].clientX) / 2, y: (e.touches[0].clientY + e.touches[1].clientY) / 2 };
    const scale = dist / lastTouchDist;
    const newK = Math.min(2.5, Math.max(0.03, transform.k * scale));
    transform.x = center.x - (center.x - transform.x) * (newK / transform.k);
    transform.y = center.y - (center.y - transform.y) * (newK / transform.k);
    transform.k = newK;
    lastTouchDist = dist;
    document.getElementById('zoomLevel').textContent = Math.round(transform.k * 100) + '%';
    draw();
  }
}, { passive: false });

cvs.addEventListener('touchend', e => {
  if (dragging && !dragMoved && e.changedTouches.length === 1) {
    const node = hitTest(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    if (node && node.childIds.length > 0) toggleNode(node.id);
  }
  dragging = false;
});

// Double-click to zoom in on node
cvs.addEventListener('dblclick', e => {
  const node = hitTest(e.clientX, e.clientY);
  if (node) {
    // Expand and center on this node
    collapsed.delete(node.id);
    rebuild();
    centerOnNode(node.id, 0.8);
  }
});

// --- ACTIONS ---
function toggleNode(id) {
  if (collapsed.has(id)) {
    collapsed.delete(id);
  } else {
    collapsed.add(id);
  }
  rebuild();
}

function rebuild() {
  buildVisible();
  layoutTree();
  updateStats();
  draw();
}

function centerOnNode(id, targetScale) {
  const node = nodeById[id];
  if (!node) return;
  const W = window.innerWidth, H = window.innerHeight;
  if (targetScale) transform.k = targetScale;
  transform.x = W / 2 - (node.x + NODE_W / 2) * transform.k;
  transform.y = H / 2 - (node.y + NODE_H / 2) * transform.k - HEADER_H;
  document.getElementById('zoomLevel').textContent = Math.round(transform.k * 100) + '%';
  draw();
}

function showTooltip(e, node) {
  const tt = document.getElementById('tooltip');
  const desc = countDesc(findTreeNode(node.id) || { children: [] });
  tt.innerHTML = `
    <div class="tt-name">${escapeHtml(node.name)}</div>
    ${node.code ? '<div style="font-size:10px;color:#8a9a90">ID: ' + escapeHtml(node.code) + '</div>' : ''}
    <div class="tt-pos">${escapeHtml(node.position || 'N/A')}</div>
    <div class="tt-dept">${escapeHtml(node.department || 'N/A')}</div>
    <div class="tt-company">${escapeHtml(node.company || '')}</div>
    ${node.email ? '<div class="tt-email">' + escapeHtml(node.email) + '</div>' : ''}
    <div class="tt-reports">${node.childIds.length} direct reports &middot; ${desc} total in tree</div>
    ${node.childIds.length > 0 ? '<div style="font-size:10px;color:#4a7a5a;margin-top:4px;">' + (collapsed.has(node.id) ? 'Click to expand' : 'Click to collapse') + '</div>' : ''}
  `;
  tt.classList.add('active');
  positionTooltip(e.clientX, e.clientY);
}

function positionTooltip(mx, my) {
  const tt = document.getElementById('tooltip');
  const x = Math.min(mx + 16, window.innerWidth - 320);
  const y = Math.min(my + 16, window.innerHeight - 220);
  tt.style.left = x + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('active');
}

// Search
const searchInput = document.getElementById('search');
const searchResults = document.getElementById('searchResults');

searchInput.addEventListener('input', () => {
  const q = searchInput.value.toLowerCase().trim();
  if (q.length < 2) { searchResults.classList.remove('active'); return; }

  const matches = allNodesFlat.filter(n =>
    n.name.toLowerCase().includes(q) ||
    (n.position || '').toLowerCase().includes(q) ||
    (n.department || '').toLowerCase().includes(q) ||
    (n.email || '').toLowerCase().includes(q) ||
    (n.code || '').toLowerCase().includes(q)
  ).slice(0, 20);

  if (matches.length === 0) { searchResults.classList.remove('active'); return; }

  searchResults.innerHTML = matches.map(m => `
    <div class="search-item" data-focus-id="${m.id}">
      <div class="name">${escapeHtml(m.name)}</div>
      <div class="info">${escapeHtml(m.position || '')} &middot; ${escapeHtml(m.department || '')}</div>
    </div>
  `).join('');
  searchResults.classList.add('active');
});

searchResults.addEventListener('click', e => {
  const item = e.target.closest('.search-item');
  if (!item) return;
  const id = item.dataset.focusId;
  focusNode(id);
});

searchInput.addEventListener('blur', () => {
  setTimeout(() => searchResults.classList.remove('active'), 200);
});

function focusNode(id) {
  // Expand all ancestors
  function findPath(roots, targetId) {
    for (const r of roots) {
      if (r.id === targetId) return [r.id];
      const sub = findPath(r.children || [], targetId);
      if (sub) return [r.id, ...sub];
    }
    return null;
  }
  const path = findPath(TREE_DATA, id);
  if (path) {
    for (const pid of path) collapsed.delete(pid);
  }

  rebuild();

  setTimeout(() => {
    centerOnNode(id, 0.7);
    highlightedId = id;
    draw();
    clearTimeout(highlightTimeout);
    highlightTimeout = setTimeout(() => { highlightedId = null; draw(); }, 3000);
  }, 30);

  searchResults.classList.remove('active');
  searchInput.value = '';
}

// Controls
function zoomBy(factor) {
  const cx = window.innerWidth / 2, cy = window.innerHeight / 2;
  const newK = Math.min(2.5, Math.max(0.03, transform.k * factor));
  transform.x = cx - (cx - transform.x) * (newK / transform.k);
  transform.y = cy - (cy - transform.y) * (newK / transform.k);
  transform.k = newK;
  document.getElementById('zoomLevel').textContent = Math.round(transform.k * 100) + '%';
  draw();
}

function fitToScreen() {
  if (visibleNodes.length === 0) return;
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of visibleNodes) {
    minX = Math.min(minX, n.x);
    maxX = Math.max(maxX, n.x + NODE_W);
    minY = Math.min(minY, n.y);
    maxY = Math.max(maxY, n.y + NODE_H);
  }
  const W = window.innerWidth, H = window.innerHeight - HEADER_H;
  const treeW = maxX - minX + 100, treeH = maxY - minY + 100;
  const k = Math.min(W / treeW, H / treeH, 1);
  transform.k = Math.max(0.03, k);
  transform.x = (W - treeW * transform.k) / 2 - minX * transform.k;
  transform.y = (H - treeH * transform.k) / 2 - minY * transform.k;
  document.getElementById('zoomLevel').textContent = Math.round(transform.k * 100) + '%';
  draw();
}

function expandAll() {
  collapsed.clear();
  rebuild();
}

function collapseToLevel(maxLevel) {
  collapsed.clear();
  function walk(node) {
    if (node.level >= maxLevel && node.children && node.children.length > 0) {
      collapsed.add(node.id);
    }
    for (const c of node.children || []) walk(c);
  }
  for (const r of TREE_DATA) walk(r);
  rebuild();
  fitToScreen();
}

// Filters
function toggleFilters() {
  document.getElementById('filterPanel').classList.toggle('active');
}

function buildFilterPanel() {
  const panel = document.getElementById('filterPanel');
  const depts = Object.keys(DEPT_COLORS).filter(d => d).sort();
  panel.innerHTML = `<div class="filter-title">Departments</div>` +
    depts.map(d => `
      <div class="filter-item" style="cursor:pointer" data-dept="${d}">
        <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${DEPT_COLORS[d]};flex-shrink:0"></span>
        <span>${d}</span>
      </div>
    `).join('');
  
  panel.addEventListener('click', e => {
    const item = e.target.closest('.filter-item');
    if (!item) return;
    const dept = item.dataset.dept;
    // Focus search on this department
    searchInput.value = dept;
    searchInput.dispatchEvent(new Event('input'));
    panel.classList.remove('active');
  });
}

function updateStats() {
  document.getElementById('totalCount').textContent = allNodesFlat.length;
  const depts = new Set(allNodesFlat.map(n => n.department).filter(Boolean));
  document.getElementById('deptCount').textContent = depts.size;
}

// --- INIT ---
resizeCanvas();
indexAllNodes();

// Default: collapse at level 2 (show CEO + direct reports, rest collapsed)
function initCollapse() {
  function walk(node) {
    if (node.level >= 2 && node.children && node.children.length > 0) {
      collapsed.add(node.id);
    }
    for (const c of node.children || []) walk(c);
  }
  for (const r of TREE_DATA) walk(r);
}
initCollapse();
rebuild();
fitToScreen();
buildFilterPanel();

window.addEventListener('resize', () => {
  resizeCanvas();
  draw();
});

// Keyboard shortcuts
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === '=' || e.key === '+') zoomBy(1.3);
  if (e.key === '-') zoomBy(0.7);
  if (e.key === '0') fitToScreen();
  if (e.key === 'e') expandAll();
  if (e.key === 'c') collapseToLevel(2);
  if (e.key === '/') { e.preventDefault(); searchInput.focus(); }
});
</script>
</body>
